<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0612"/>
      <stop offset="1" stop-color="#1c1233"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sigma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid background -->
  <g stroke="#1a1232" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- σ mark -->
  <g transform="translate(80, 90)">
    <circle cx="40" cy="40" r="40" fill="url(#sigma)"/>
    <circle cx="40" cy="40" r="34" fill="#0a0612"/>
    <text x="40" y="56" text-anchor="middle" fill="#f0abfc" font-family="Geist, Inter, sans-serif" font-size="44" font-weight="500">σ</text>
  </g>
  <text x="180" y="148" fill="#ebe4f0" font-family="Geist, Inter, sans-serif" font-size="34" font-weight="600">SigmaFi Research</text>

  <!-- Headline -->
  <text x="80" y="320" fill="#ebe4f0" font-family="Geist, Inter, sans-serif" font-size="78" font-weight="500" letter-spacing="-2">Engineering edge</text>
  <text x="80" y="408" fill="#ebe4f0" font-family="Geist, Inter, sans-serif" font-size="78" font-weight="500" letter-spacing="-2">across every</text>
  <text x="80" y="496" fill="#f0abfc" font-family="Geist, Inter, sans-serif" font-size="78" font-weight="500" letter-spacing="-2">liquid market.</text>

  <!-- Footer rule -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#1f1432"/>
  <text x="80" y="595" fill="#b6a8c4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" letter-spacing="3">A TECHNOLOGY-DRIVEN MULTI-ASSET QUANT FIRM · HONG KONG</text>
</svg>
